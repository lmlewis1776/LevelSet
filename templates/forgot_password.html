{% extends "base.html" %}
{% block title %}Reset Password — LevelSet{% endblock %}
{% block content %}
<section class="auth-page"> 
    <div class="auth-card" style="max-width: 480px; margin: 4rem auto; background: var(--white); padding: 2.5rem; border-radius: var(--radius-lg); border: 1px solid var(--gray-200); box-shadow: var(--shadow-sm);"> 
        <h1 style="font-family: 'Playfair Display', serif; font-size: 2rem; color: var(--gray-900); margin-bottom: 0.5rem; text-align: center;">Forgot Password</h1> 
        <p class="subtitle" style="text-align: center; color: var(--gray-500); margin-bottom: 2rem;">Enter your email below and we'll send you a secure link to reset your password.</p> 
        <form method="POST" action="/forgot-password"> 
            <!-- Honeypot field --> 
            <div style="display: none;" aria-hidden="true"> 
                <input type="text" name="website_verify" tabindex="-1" autocomplete="off" placeholder="Do not fill this out"> 
            </div>
            <div class="form-group" style="margin-bottom: 1.5rem;"> 
                <label for="email" style="font-weight: 600; color: var(--gray-700);">Email Address</label> 
                <input type="email" id="email" name="email" class="form-control" required placeholder="you@organization.org"> 
            </div> 
            <button type="submit" class="btn btn-primary" style="width: 100%; font-weight: 600;">Send Reset Link</button> 
        </form> 
        <p style="text-align: center; margin-top: 2rem; font-size: 0.9rem; color: var(--gray-500);"> 
            Remember your password? <a href="/login" style="color: var(--primary); font-weight: 500; text-decoration: none;">Log In</a> 
        </p> 
    </div>
</section>
{% endblock %}
