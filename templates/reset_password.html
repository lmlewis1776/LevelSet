{% extends "base.html" %}
{% block title %}Set New Password — LevelSet{% endblock %}
{% block content %}
<section class="auth-page"> 
    <div class="auth-card" style="max-width: 480px; margin: 4rem auto; background: var(--white); padding: 2.5rem; border-radius: var(--radius-lg); border: 1px solid var(--gray-200); box-shadow: var(--shadow-sm);"> 
        <h1 style="font-family: 'Playfair Display', serif; font-size: 2rem; color: var(--gray-900); margin-bottom: 0.5rem; text-align: center;">Set New Password</h1> 
        <p class="subtitle" style="text-align: center; color: var(--gray-500); margin-bottom: 2rem;">Choose a strong, secure new password for your account.</p> 
        <form method="POST" action="/reset-password/{{ token }}"> 
            <!-- Honeypot field --> 
            <div style="display: none;" aria-hidden="true"> 
                <input type="text" name="website_verify" tabindex="-1" autocomplete="off" placeholder="Do not fill this out"> 
            </div>
            <div class="form-group" style="margin-bottom: 1.25rem;"> 
                <label for="new_password" style="font-weight: 600; color: var(--gray-700);">New Password</label> 
                <input type="password" id="new_password" name="new_password" class="form-control" required placeholder="At least 8 characters recommended"> 
            </div>
            <div class="form-group" style="margin-bottom: 1.5rem;"> 
                <label for="confirm_password" style="font-weight: 600; color: var(--gray-700);">Confirm New Password</label> 
                <input type="password" id="confirm_password" name="confirm_password" class="form-control" required placeholder="Confirm your new password"> 
            </div> 
            <button type="submit" class="btn btn-primary" style="width: 100%; font-weight: 600;">Update Password</button> 
        </form> 
    </div>
</section>
{% endblock %}
